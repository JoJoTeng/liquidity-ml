# ----------------------------------------------------------
# Liquidity (raw columns from 00_fetch_data.py)
# ----------------------------------------------------------
liquidity:
  primary: "dvol_21d" # 21-day trailing avg dollar volume (Eq. 14)
  measures:
    - dvol_21d # PRIMARY: 21-day trailing avg dollar volume (from daily CRSP)
    - dvol_6m # 6-month rolling avg monthly dollar volume
    # - dvol_monthly # monthly dollar volume
    - me_raw # market equity
    - lambda_tc # price impact (Frazzini-style)
    - BidAskSpread # bid-ask spread (from CZ predictors)
    - liu_lm # Liu (2006) composite illiquidity LM_12 (from daily CRSP)
    - daily_sigma # 21-day rolling daily return volatility (for TC model)
    # - DolVol # dollar volume (from CZ predictors)

# ----------------------------------------------------------
# Weighting Schemes (Equations 8–11)
# ----------------------------------------------------------
weighting:
  primary: "softmax_rank"

  softmax_rank: # Eq. 8
    lambda: 2.0

  linear_dolvol: {} # Eq. 9

  transaction_cost: # Eq. 10
    spread_col: "BidAskSpread" # from CZ predictors

  quintile_discrete: # Eq. 11
    weights:
      Q1: 0.1
      Q2: 0.3
      Q3: 1.0
      Q4: 3.0
      Q5: 5.0

# ----------------------------------------------------------
# ML Models (3 models, each run with standard + weighted)
# ----------------------------------------------------------
models:
  # All 3 models are run in the 2×2 framework independently.
  # Results are reported per-model + ensemble average.
  run_models:
    - xgboost
    - random_forest
    - neural_network

  xgboost:
    n_estimators: 500
    max_depth: 4
    learning_rate: 0.01
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 5
    reg_alpha: 0.1
    reg_lambda: 1.0
    search_space:
      max_depth: [3, 4, 5, 6]
      learning_rate: [0.005, 0.01, 0.05]
      n_estimators: [300, 500, 800]
      min_child_weight: [1, 5, 10, 20]

  random_forest:
    n_estimators: 300
    max_depth: 6
    max_features: "sqrt"
    min_samples_leaf: 100
    n_jobs: -1
    search_space:
      n_estimators: [100, 300, 500]
      max_depth: [4, 6, 8]
      min_samples_leaf: [50, 100, 200]

  neural_network:
    hidden_layers: [64, 32, 16]
    activation: "relu"
    dropout: 0.5
    learning_rate: 0.001
    batch_size: 256
    epochs: 100
    patience: 20
    weight_decay: 0.0001
    search_space:
      hidden_layers:
        - [64, 32]
        - [64, 32, 16]
        - [128, 64, 32]
      dropout: [0.3, 0.5]
      learning_rate: [0.001, 0.0005]

# ----------------------------------------------------------
# Training Protocol
# ----------------------------------------------------------
training:
  train_window: 120 # months (10 years, rolling)
  validation_window: 12 # months (1 year, for hyperparameter selection)
  test_window: 1 # month (out-of-sample prediction)
  retune_frequency: 24 # months
  oos_start: 200001 # January 2000
  oos_end: 202412   # December 2024

  preprocessing:
    normalization: "rank_quantile" # rank → [-0.5, 0.5]
    missing_fill: "zero"

# ----------------------------------------------------------
# Portfolio Construction
# ----------------------------------------------------------
portfolio:
  n_quantiles: 10
  long_quantile: 10
  short_quantile: 1
  position_cap: 0.05
  min_liquidity_pctile: 0.40
  rebalance_frequency: "monthly"
  buffer_quantiles: 1             # No-trade buffer: keep stocks that move ±1 decile
                                  # from target. A stock in the long decile (10) stays
                                  # if it only drops to decile 9. Reduces turnover ~30-50%.

# ----------------------------------------------------------
# Transaction Cost Model
# ----------------------------------------------------------
transaction_costs:
  spread_col: "BidAskSpread"
  spread_scale: 0.30              # Corwin-Schultz → effective spread calibration
                                  # CZ BidAskSpread uses high-low estimator (~94bps avg),
                                  # institutional effective spreads are ~20-30bps (3-5× lower).
                                  # 0.30 maps ~94bps → ~28bps, consistent with TAQ evidence.
  spread_cap: 0.05               # Cap spread at 5% (clip outliers)
  lambda_market_impact: 0.1       # Frazzini et al. (2018) Eq. 12
  sigma_col: "daily_sigma"        # 21-day rolling daily return volatility
  adv_col: "dvol_21d"            # average daily dollar volume
  aum_scenarios:
    - 100_000_000
    - 500_000_000
    - 1_000_000_000
    - 5_000_000_000

# ----------------------------------------------------------
# Statistical Inference
# ----------------------------------------------------------
inference:
  newey_west_lags: 6
  bootstrap_samples: 5000
  significance_level: 0.05
  one_sided_test: true
  calibrate_block_length: false   # LW (2008) Algorithm 3.1 — true is very expensive
  block_grid: [2, 4, 6, 8, 10]   # block sizes for bootstrap Sharpe test
  factor_models:
    capm: ["Mkt-RF"]
    ff3: ["Mkt-RF", "SMB", "HML"]
    ff5: ["Mkt-RF", "SMB", "HML", "RMW", "CMA"]

# ----------------------------------------------------------
# SHAP Analysis (Hypothesis 2)
# ----------------------------------------------------------
shap:
  compute_shap: true              # Master switch (set false for fast runs)
  background_samples: 100         # Background data size for NN explainer
  max_test_samples: 500           # Cap test stocks for NN KernelExplainer speed
  tree_check_additivity: false    # Skip slow consistency check for TreeExplainer
