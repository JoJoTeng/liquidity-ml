# ============================================================
# Liquidity-Aware ML — Master Configuration
# ============================================================

project:
  name: "liquidity_ml"
  seed: 42
  output_dir: "outputs"
  data_dir: "data"

# ----------------------------------------------------------
# Data
# ----------------------------------------------------------
data:
  # Input files (in data/ directory)
  signed_predictors_csv: "signed_predictors_all_wide.csv"
  ff_factors_csv: "FFResearch_Data_Factors.csv"

  start_yyyymm: 197201
  end_yyyymm: 202412

  id_cols: ["permno", "yyyymm"]
  target_col: "excess_ret"
  return_col: "ret"

  # Feature groups for mechanism analysis (Hypothesis 2)
  # Core groups: narrow, cleanest exemplars for the main test
  illiquidity_features:
    - IdioVol3F
    - IdioVolAHT
    - zerotrade1M
    - zerotrade6M
    - zerotrade12M
    - MaxRet
    - VolSD
    - BetaLiquidityPS

  tradable_features:
    - Mom12m
    - Mom6m
    - BMdec
    - GP
    - AssetGrowth
    - RoE
    - CF
    - CBOperProf

  # Extended groups: broader sets for robustness checks
  # Report both narrow (above) and extended results
  illiquidity_features_extended:
    # Core 8
    - IdioVol3F
    - IdioVolAHT
    - zerotrade1M
    - zerotrade6M
    - zerotrade12M
    - MaxRet
    - VolSD
    - BetaLiquidityPS
    # Additional microstructure / liquidity-related
    - BidAskSpread # direct trading cost
    - DolVol # dollar volume (inverse liquidity)
    - Size # small-cap illiquidity premium
    - Price # low-price stocks are less liquid

  tradable_features_extended:
    # Core 8
    - Mom12m
    - Mom6m
    - BMdec
    - GP
    - AssetGrowth
    - RoE
    - CF
    - CBOperProf
    # Momentum variants
    - Mom12mOffSeason
    - MomOffSeason
    - MomSeason
    - MomSeasonShort
    - IndMom
    - IntMom
    - ResidualMomentum
    - LRreversal
    - STreversal
    # Value
    - BPEBM
    - EBM
    - cfp
    - BookLeverage
    - EquityDuration
    # Investment
    - Investment
    - InvestPPEInv
    - grcapx
    - ChInv
    - ChInvIA
    # Earnings / announcements
    - EarningsSurprise
    - RevenueSurprise
    - AnnouncementReturn
    # Profitability
    - CashProd
    - OPLeverage
    # Accruals
    - Accruals
    - TotalAccruals
    - NOA
    - dNoa
    # Issuance / corporate actions
    - ShareIss1Y
    - hire

  # Curated features with coverage from 1972 onward (~75 predictors).
  # Using a hand-picked subset avoids massive row loss from dropna()
  # on sparse early-period features (many CZ predictors start post-1985).
  selected_features:
    - AM
    - Accruals
    - AnnouncementReturn
    - AssetGrowth
    - BetaLiquidityPS
    - BidAskSpread
    - BMdec
    - BookLeverage
    - BPEBM
    - CBOperProf
    - CF
    - cfp
    - CashProd
    - ChAssetTurnover
    - ChEQ
    - ChInv
    - ChInvIA
    - ChNWC
    - ChNNCOA
    - ChTax
    - ConvDebt
    - CoskewACX
    - DelCOA
    - DelCOL
    - DelEqu
    - DelFINL
    - DelLTI
    - DelNetFin
    - DivInit
    - DivOmit
    - DolVol
    - EBM
    - EarningsSurprise
    - EquityDuration
    - GP
    - grcapx
    - Herf
    - IdioVol3F
    - IdioVolAHT
    - IndIPO
    - IndMom
    - IntMom
    - InvestPPEInv
    - Investment
    - LRreversal
    - Leverage
