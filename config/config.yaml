# ============================================================
# Liquidity-Aware ML — Master Configuration
# ============================================================

project:
  name: "liquidity_ml"
  seed: 42
  output_dir: "outputs"
  data_dir: "data"

# ----------------------------------------------------------
# Data
# ----------------------------------------------------------
data:
  # Input files (in data/ directory)
  signed_predictors_csv: "signed_predictors_all_wide.csv"
  ff_factors_csv: "FFResearch_Data_Factors.csv"

  start_yyyymm: 198901
  end_yyyymm: 202412

  id_cols: [ "permno", "yyyymm" ]
  target_col: "excess_ret"
  return_col: "ret"

  # Feature groups for mechanism analysis (Hypothesis 2).
  # These lists are constrained to the final 113-feature training universe
  # saved in data/feature_list.json by scripts/01_process_data.py.
  # Narrow groups are economic-taxonomy groups; they describe interpretable
  # liquidity/friction proxies versus standard anomaly/fundamental signals.
  illiquidity_features:
    - Size
    - Price
    - DolVol
    - BidAskSpread
    - zerotrade1M
    - zerotrade6M
    - zerotrade12M
    - PriceDelayRsq
    - BetaLiquidityPS
    - Illiquidity
    - IdioVol3F
    - IdioVolAHT
    - RealizedVol
    - ReturnSkew
    - MaxRet

  tradable_features:
    - Mom12m
    - Mom6m
    - IndMom
    - STreversal
    - BM
    - CF
    - cfp
    - GP
    - RoE
    - CBOperProf
    - AssetGrowth
    - ChInv
    - Investment
    - hire
    - Tax

  # Extended groups are empirical Step 2 groups for importance reallocation.
  # They are not a broad economic taxonomy.
  # They are used for formal feature-importance reallocation.
  # These are empirical Step 2 groups from quintile_fm_coefficients_full_raw.csv.
  # illiquidity_features_extended = significant only in Q1, expected to lose
  # importance under weighted training. tradable_features_extended = significant
  # in Q5 only or in both Q1 and Q5, expected to gain or remain stable.
  illiquidity_features_extended:
    # Q1-only predictive features (43)
    - AM
    - AbnormalAccruals
    - AnalystRevision
    - AnnouncementReturn
    - AssetGrowth
    - BM
    - BMdec
    - BPEBM
    - Beta
    - BidAskSpread
    - BookLeverage
    - CF
    - CashProd
    - ChAssetTurnover
    - ChEQ
    - ChTax
    - CompEquIss
    - DelNetFin
    - DolVol
    - EarningsStreak
    - FEPS
    - Illiquidity
    - IndMom
    - IndRetBig
    - IntanBM
    - Mom12m
    - Mom6m
    - MomSeasonShort
    - NetPayoutYield
    - OPLeverage
    - PctAcc
    - Price
    - REV6
    - RealizedVol
    - ReturnSkew
    - ReturnSkew3F
    - RevenueSurprise
    - ShareIss1Y
    - ShareIss5Y
    - Tax
    - XFIN
    - grcapx3y
    - roaq

  tradable_features_extended:
    # Q5-only predictive features (4)
    - CBOperProf
    - ChNNCOA
    - Leverage
    - MomSeason11YrPlus
    # Significant in both Q1 and Q5 (9)
    - Cash
    - EarningsSurprise
    - MeanRankRevGrowth
    - MomSeason
    - MomSeason06YrPlus
    - RD
    - STreversal
    - TrendFactor
    - betaVIX

# ----------------------------------------------------------
# Liquidity (raw/helper columns copied to liq_* by src/data/loader.py)
# ----------------------------------------------------------
liquidity:
  primary: "dvol_21d" # 21-day trailing avg dollar volume (Eq. 14)
  # Columns that need raw liq_* copies for current weighting, quintile,
  # robustness, and transaction-cost code.
  measures:
    - dvol_21d # PRIMARY: 21-day trailing avg dollar volume (from daily CRSP)
    - me_raw # market cap robustness / value-weighted deployment proxy
    - BidAskSpread # TC model spread input; raw copy of predictor
    - excess_sigma_12m_daily # daily-scaled excess_sigma_12m for daily ADV impact

# ----------------------------------------------------------
# Weighting Schemes (Equations 11–14)
# ----------------------------------------------------------
weighting:
  # Family 1: dolvol - DolVol/mean(DolVol), AUM-independent
  # Family 2: softmax_rank - exp(lambda * rank(DolVol)), AUM-independent
  # Family 3: tc - Eq.23 exp(-alpha*TC), AUM-dependent
  # This block only selects the default training-weight family.
  # dolvol and softmax_rank use liquidity.primary; tc uses transaction_costs below.
  primary: "dolvol"
  # Default softmax-rank lambda used when --softmax-lambda is omitted.
  softmax_rank_lambda: 2.0
  # Formal softmax-rank robustness grid. scripts/20_formal_run_experiment.py
  # reads an individual value through --softmax-lambda; generate_hpc_jobs.sh runs
  # both values and writes separate folders: softmax_rank_lam2 and lam3.
  softmax_rank_lambdas: [ 2.0, 3.0 ]

# ----------------------------------------------------------
# ML Models (3 models, each run with standard + weighted)
# ----------------------------------------------------------
models:
  # Active models run in the 2×2 framework independently.
  # Neural network is active; BatchNorm is safe with the rolling-window batch sizes.
  run_models:
    - elastic_net
    - xgboost
    - neural_network

  elastic_net:
    alpha: 0.001
    l1_ratio: 0.5
    max_iter: 10000
    search_space:
      alpha: [ 0.000001, 0.00001, 0.0001, 0.001, 0.01, 0.1 ]
    n_random_search: 6 # full grid = 6, all evaluated

  xgboost:
    n_estimators: 1000
    max_depth: 2 # GKX (2020): shallow weak learners
    learning_rate: 0.01
    subsample: 0.8
    colsample_bytree: 0.3 # Each tree sees ~1/3 of features (decorrelation)
    min_child_weight: 5
    reg_alpha: 0.0
    reg_lambda: 0.1
    search_space:
      max_depth: [ 3, 4, 5 ]
      learning_rate: [ 0.001, 0.01, 0.05 ]
      n_estimators: [ 500, 1000, 2000 ]
      min_child_weight: [ 10, 50, 100 ]
    n_random_search: 81 # full grid = 81 combos, all evaluated

  neural_network:
    hidden_layers: [ 32, 16, 8 ] # GKX (2020) NN3 — best architecture
    activation: "relu"
    batch_norm: true # Algorithm 7 — after ReLU
    dropout: 0.0 # not used by GKX
    batch_size: 10000 # Table A.5
    epochs: 100 # Table A.5
    patience: 10 # Bumped from GKX's 5; single-seed NN val_loss is noisier than ensemble
    learning_rate: 0.001
    l1_penalty: 0.00001
    weight_decay: 0.0
    n_ensemble_seeds: 1 # no ensemble
    tune_n_ensemble_seeds: 1 # ensemble size used for each tuning candidate; <= n_ensemble_seeds for speed
    search_space:
      learning_rate: [ 0.001, 0.003, 0.01 ]
      l1_penalty: [ 0.00001, 0.0001, 0.001 ]
    # Total grid: 3 LR x 3 L1 = 9 combos, best selected via validation
# ----------------------------------------------------------
# Training Protocol
# ----------------------------------------------------------
training:
  train_window: 120 # months (10 years, rolling)
  validation_window: 12 # months (1 year, for hyperparameter selection)
  test_window: 1 # month (out-of-sample prediction)
  retune_frequency: 12 # months
  oos_start: 200001 # January 2000
  oos_end: 202412 # December 2024

  preprocessing:
    normalization: "rank_quantile" # average rank -> [0, 1] within month
    missing_fill: 0.5 # midpoint of [0, 1]

# ----------------------------------------------------------
# Portfolio Construction
# ----------------------------------------------------------
portfolio:
  n_quantiles: 10
  long_quantile: 10
  short_quantile: 1
  rebalance_frequency: "monthly"
  # No liquidity filter - TC-penalised sort (Column 2) replaces it.
  # No position cap - equal-dollar within each decile leg.

  # ----------------------------------------------------------
  # Transaction Cost Model
  # ----------------------------------------------------------
transaction_costs:
  spread_col: "BidAskSpread"
  lambda_market_impact: 0.1 # Frazzini et al. (2018) Eq. 12
  weight_alpha:
    mode: "inverse_median" # alpha_t = scale / median(TC_t)
    scale: 3.0 # primary TC-weight intensity; median-cost raw penalty is exp(-3)
  lambda_calibration:
    enabled: false # If true: lambda = anchor_impact / (sqrt(anchor_trade_frac_adv) * sigma_bar)
    anchor_trade_frac_adv: 0.01 # 1% ADV trade
    anchor_impact: 0.001 # 10 bps price impact
    sigma_bar_stat: "median" # median or mean over the input panel
  sigma_col: "excess_sigma_12m_daily" # daily-scaled 12-month excess-return volatility
  adv_col: "dvol_21d" # average daily dollar volume
  aum_scenarios:
    - 10_000_000 # $10M - small fund
    - 100_000_000 # $100M - medium fund
    - 500_000_000 # $500M - primary specification
    - 1_000_000_000 # $1B - large fund

# ----------------------------------------------------------
# Statistical Inference
# ----------------------------------------------------------
inference:
  newey_west_lags: 6
  bootstrap_samples: 5000
  significance_level: 0.05
  one_sided_test: true
  calibrate_block_length: false # LW (2008) Algorithm 3.1 — true is very expensive
  block_grid: [ 2, 4, 6, 8, 10 ] # block sizes for bootstrap Sharpe test
  factor_models:
    capm: [ "Mkt-RF" ]
    ff3: [ "Mkt-RF", "SMB", "HML" ]
    ff5: [ "Mkt-RF", "SMB", "HML", "RMW", "CMA" ]
    ff5_mom: [ "Mkt-RF", "SMB", "HML", "RMW", "CMA", "Mom" ] # Primary for v3

# ----------------------------------------------------------
# SHAP Analysis (Hypothesis 2)
# ----------------------------------------------------------
shap:
  compute_shap: true # Master switch (set false for fast runs)
  background_samples: 100 # Background data size for NN explainer
  max_test_samples: 500 # Cap test stocks for NN KernelExplainer speed
  tree_check_additivity: false # Skip slow consistency check for TreeExplainer
